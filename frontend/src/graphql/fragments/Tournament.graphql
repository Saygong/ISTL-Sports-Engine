fragment Tournament on Tournament {
  id
  name
  composition
  court {
    name
  }
  gender
  maxAge
  minAge
  numberOfMatches
  organizer {
    ... on Organizer {
      id
      firstName
      lastName
    }
  }
  sport {
    ...Sport
  }
  startDate
  matches {
    ...Match
  }
  joinedBySomeone {
    ...Team
  }
  __typename
}
