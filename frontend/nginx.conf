server {
    listen 80;
    server_name localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;

        # Redirect all 404s to index.html so React Router can take over
        try_files $uri $uri/ /index.html;
    }

    # Enable gzip compression for faster loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml outdoor/x-icon;
}