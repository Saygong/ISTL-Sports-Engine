# By creating a custom Docker network, you don't need to publish ports for your upstream services to all the Docker
# host's interfaces.
# [https://nginxproxymanager.com/advanced-config/#best-practice-use-a-docker-network]
networks:
  npm-shared:
    external: true

services:

  backend:
    # Reachable locally via istl.distributed-backend.local when the /etc/hosts file contains the following entry:
    # 127.0.0.1 istl.distributed-backend.local
    container_name: distributed-backend # Reachable locally through istl.distributed-backend.local
    networks:

      - npm-shared
    environment:

      - RAILS_PORT
      - RAILS_MASTER_KEY
      - RAILS_ENV
    build:
      context: .
    restart: on-failure
    develop:
      watch:
        - action: sync # Action sync is ideal for frameworks that support "Hot Reload" or equivalent functionality
          path: ./app
          target: /backend/app