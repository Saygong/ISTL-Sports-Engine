# Define named volumes for persistent data storage across container restarts
volumes:
  db-data:
    external: false

services:
  db:
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - POSTGRES_DB_NAME
    image: postgres:16.11-alpine
    ports:
      - ${POSTGRES_PORT}:${POSTGRES_PORT}
    # Map the named volume to PostgreSQL's internal data directory
    volumes:
      - db-data:/var/lib/postgresql/data
