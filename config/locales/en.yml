# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  hello: "Hello world"

  activerecord:
    models:
      user/player:
        one: Player
        other: Players
      user/organizer:
        one: Organizer
        other: Organizers
      user/referee:
        one: Referee
        other: Referees
      court:
        one: Court
        other: Courts
      court/field:
        one: Field
        other: Fields

  active_admin:
    dashboard: "Dashboard"
    dashboard_welcome:
      welcome: "Welcome to Active Admin. This is the default dashboard page."
      call_to_action: "Start navigating through the panels to perform actions"
    models:
      user:
        form:
          details: "Details"

  errors:
    models:
      tournament:
        min_age_gt_max_age: "The minimum age cannot be higher than the maximum age"
      team:
        tournament_teams_capacity: "This tournament is full and more teams can be created"
    controllers:
      referees:
        unauthorized: "You must be a referee to access referee features"
      organizers:
        unauthorized: "You must be an organizer to access organizer features"
      players:
        unauthorized: "You must be a player to access player features"

  notices:
    controllers:
      players:
        tournaments:
          join: "Registration completed"
        matches:
          book: "Match booked successfully"
          unbook: "Booking removed"
